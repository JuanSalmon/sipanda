; SIPANDA PTM - PHP per-directory config
; Berlaku untuk semua script di bawah folder ini dan subfoldernya.
; Laragon default sudah load .user.ini otomatis (PHP-FPM/Apache handler).

; Batas upload file: 5 MB.
; post_max_size harus >= upload_max_filesize (form bisa berisi field lain).
upload_max_filesize = 5M
post_max_size = 6M

; Batas memory untuk parsing .xlsx via PhpSpreadsheet.
; File 5 MB setelah di-decompress bisa ~50-100 MB di memory.
memory_limit = 256M

; Batas waktu eksekusi untuk proses upload + parsing.
; Dinaikkan ke 120s karena parsing xlsx besar via PhpSpreadsheet
; bisa memakan waktu 20+ detik untuk file mendekati 5 MB.
max_execution_time = 120

; Keamanan: matikan display_errors di production.
display_errors = Off
log_errors = On
error_log = C:/laragon/www/sipanda/php-error.log